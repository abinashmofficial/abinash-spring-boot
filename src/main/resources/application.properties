spring.application.name=abinash

# Console log pattern: thread displays as [abinash] without extra spaces
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%replace(%t){'main','abinash'}]){faint} %clr(%logger){cyan} : %m%n

# Suppress minor Undertow websocket buffer warning
logging.level.io.undertow.websockets.jsr=ERROR
